- name: Install Visual Studio Code
  community.general.homebrew_cask:
    name: visual-studio-code

- name: Install PyCharm Community Edition
  community.general.homebrew_cask:
    name: pycharm-ce

- name: Check for Devin Desktop installed outside Homebrew
  ansible.builtin.stat:
    path: /Applications/Devin.app
  register: ide_devin_app

- name: Install Devin Desktop
  community.general.homebrew_cask:
    name: devin-desktop
  when: not ide_devin_app.stat.exists

- name: Install cline for vscode/devin code generation in background
  community.general.npm:
    name: cline
    global: true
    state: present

- name: Install intellij idea Community Edition
  community.general.homebrew_cask:
    name: intellij-idea-ce

- name: Install Google's Gemini CLI
  community.general.npm:
    name: '@google/gemini-cli'
    global: true
    state: present
  tags: [ide, gemini-cli]

- name: Install OpenAI's Codex CLI
  community.general.npm:
    name: '@openai/codex'
    global: true
    state: present
  tags: [ide, codex-cli]
