---
# Install and configure Xcode for macOS development

- name: Ensure mas (Mac App Store CLI) is installed
  community.general.homebrew:
    name: mas
    state: present

# mas 5+ removed `account`; sign in to the App Store GUI before running this role.
- name: Get Xcode from Mac App Store
  ansible.builtin.command: mas get 497799835
  args:
    creates: /Applications/Xcode.app
  become: true

- name: Check for Xcode developer directory
  ansible.builtin.stat:
    path: /Applications/Xcode.app/Contents/Developer
  register: xcode_devdir

- name: Get current developer directory
  ansible.builtin.command: xcode-select -p
  register: xcode_select_path
  changed_when: false
  failed_when: false

- name: Set xcode-select to full Xcode app if installed
  ansible.builtin.command: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
  when: xcode_devdir.stat.exists and xcode_select_path.stdout != '/Applications/Xcode.app/Contents/Developer'
  become: true

- name: Run first launch tasks (may be no-op if already done)
  ansible.builtin.command: sudo xcodebuild -runFirstLaunch
  become: true
  changed_when: false
  failed_when: false

- name: Accept Xcode license (idempotent)
  ansible.builtin.command: sudo xcodebuild -license accept
  become: true
  changed_when: false
  failed_when: false

- name: Xcode download IOS
  ansible.builtin.command: xcodebuild -downloadPlatform iOS
  become: true
  changed_when: false
  failed_when: false
