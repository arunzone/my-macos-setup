- name: Install Spotify for music
  community.general.homebrew_cask:
    name: spotify

- name: Install VLC media player
  community.general.homebrew_cask:
    name: vlc

- name: Install ffmpeg for audio and video conversion
  community.general.homebrew:
    name: ffmpeg

- name: Install handbrake for video transcoding
  community.general.homebrew_cask:
    name: handbrake
  when: "'handbrake' not in skipped_casks"
