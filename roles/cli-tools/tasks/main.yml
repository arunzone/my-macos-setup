- name: Install newer bash
  community.general.homebrew:
    name: bash

- name: Install ohmyzsh shell experience
  ansible.builtin.shell: /bin/sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"
  args:
    creates: ~/.oh-my-zsh

- name: Setup ohmyzsh theme
  ansible.builtin.lineinfile:
    path: ~/.zshrc
    regexp: '^(.*)ZSH_THEME="(.*)"$'
    line: 'ZSH_THEME="gnzh"'
    backrefs: true

- name: Install jq command-line JSON processor
  community.general.homebrew:
    name: jq

- name: Install yq YAML query procesor
  community.general.homebrew:
    name: yq

- name: Install XmlStarlet XML toolkit
  community.general.homebrew:
    name: xmlstarlet

- name: Install docutils for processing documentation
  ansible.builtin.pip:
    name: docutils
    executable: pipx

- name: Install python-json2csv for JSON to CSV
  ansible.builtin.pip:
    name: python-json2csv
    executable: pipx

- name: Install cloc lines of code utility
  community.general.homebrew:
    name: cloc

- name: Install scc code counter
  community.general.homebrew:
    name: scc

- name: Install petname command line name generator
  ansible.builtin.pip:
    name: petname
    executable: pipx

- name: Install core GNU utilities
  community.general.homebrew:
    name: coreutils

- name: Ensure GNU coreutils (gnubin) are first in PATH for zsh
  ansible.builtin.blockinfile:
    create: true
    path: ~/.zshrc
    marker: "# {mark} ANSIBLE MANAGED BLOCK (coreutils-gnubin)"
    mode: "0644"
    block: |
      # Prefer GNU coreutils over BSD equivalents (e.g., date, ls, cp)
      if type brew &>/dev/null; then
        export PATH="$(brew --prefix coreutils)/libexec/gnubin:$PATH"
      fi

- name: Install GNU implementation of sed
  community.general.homebrew:
    name: gnu-sed

- name: Install tool for working with Architecture Decision Records
  community.general.homebrew:
    name: adr-tools

- name: Install git-quick-stats
  community.general.homebrew:
    name: git-quick-stats

- name: Install GitHub tools
  community.general.homebrew:
    name: gh,git-lfs,git-filter-repo,bfg

- name: Install actionlint GitHub Actions workflow linter
  community.general.homebrew:
    name: actionlint

- name: Install zsh-completions
  community.general.homebrew:
    name: zsh-completions

- name: Setup zsh-completions
  ansible.builtin.blockinfile:
    create: true
    path: ~/.zshrc
    marker: "# {mark} ANSIBLE MANAGED BLOCK (BASH_COMPLETION)"
    mode: "0644"
    block: |
      if type brew &>/dev/null; then
      FPATH=$(brew --prefix)/share/zsh-completions:$FPATH

      autoload -Uz compinit
      compinit
      fi

- name: Install icdiff side-by-side diff tool
  community.general.homebrew:
    name: icdiff

- name: Install telnet
  community.general.homebrew:
    name: telnet

- name: Install HTTPie cURL wrapper
  community.general.homebrew:
    name: httpie
    state: present

- name: Install watch for repeating command line commands
  community.general.homebrew:
    name: watch

- name: Install topgrade upgrade manager
  community.general.homebrew:
    name: topgrade

- name: Install htop for process monitoring
  community.general.homebrew:
    name: htop

- name: Install iftop for network monitoring
  community.general.homebrew:
    name: iftop

- name: Install NCurses Disk Usage utility
  community.general.homebrew:
    name: ncdu

- name: Install traceroute for network diagnostics
  community.general.homebrew:
    name: tcptraceroute

- name: Install gnuplot for interactive function plotting
  community.general.homebrew:
    name: gnuplot

- name: Install spark for generating Sparklines
  community.general.homebrew:
    name: spark

- name: Install watchman
  community.general.homebrew:
    name: watchman

- name: Install thefuck
  community.general.homebrew:
    name: thefuck

- name: Install tree
  community.general.homebrew:
    name: tree

- name: Install DuckDB CLI
  community.general.homebrew:
    name: duckdb

- name: Install pandoc document converter
  community.general.homebrew:
    name: pandoc

# HTML/CSS-based PDF engine for pandoc (--pdf-engine=weasyprint).
# Maintained replacement for wkhtmltopdf, which was abandoned upstream
# and removed from Homebrew.
- name: Install WeasyPrint HTML-to-PDF engine for pandoc
  community.general.homebrew:
    name: weasyprint

# Pandoc needs a LaTeX engine (pdflatex/xelatex) to generate PDFs;
# BasicTeX provides it without the full 5+ GB MacTeX distribution.
# Its pkg installer runs `sudo installer`, so use the askpass helper
# created in playbook.yml pre_tasks.
- name: Install BasicTeX for pandoc PDF generation via askpass
  block:
    - name: Stage transient sudo password for askpass helper
      ansible.builtin.copy:
        dest: ~/.ansible/.sudo_pass
        mode: "0600"
        content: "{{ become_password }}"
      no_log: true

    - name: Install BasicTeX for pandoc PDF generation
      community.general.homebrew_cask:
        name: basictex
      environment:
        SUDO_ASKPASS: "{{ ansible_facts['env']['HOME'] }}/.ansible/sudo_askpass.sh"
  always:
    - name: Remove transient sudo password
      ansible.builtin.file:
        path: ~/.ansible/.sudo_pass
        state: absent

- name: Install Vercel CLI
  community.general.npm:
    name: vercel
    global: yes
    state: present

- name: Install 1Password CLI
  community.general.homebrew_cask:
    name: 1password-cli

- name: Install totp-cli TOTP generator
  community.general.homebrew:
    name: totp-cli

- name: Install iTerm2 shell integration and it2 utilities
  ansible.builtin.shell: /bin/sh -c "$(curl -fsSL https://iterm2.com/shell_integration/install_shell_integration_and_utilities.sh)"
  args:
    creates: ~/.iterm2/it2copy

# iTerm2 rewrites its plist on quit, so this only sticks if iTerm2 isn't running.
# Restart iTerm2 after the playbook for the change to take effect.
- name: Enable iTerm2 Python API
  community.general.osx_defaults:
    domain: com.googlecode.iterm2
    key: EnableAPIServer
    type: bool
    value: true
    state: present

- name: Install it2 CLI for controlling iTerm2 via Python API
  ansible.builtin.command: uv tool install it2
  args:
    creates: ~/.local/bin/it2

- name: Setup thefuck
  ansible.builtin.blockinfile:
    path: ~/.zshrc
    marker: "# {mark} ANSIBLE MANAGED BLOCK (thefuck)"
    block: |
      eval $(thefuck --alias)
