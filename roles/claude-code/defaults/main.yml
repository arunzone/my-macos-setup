---
claude_code_hooks:
  - require-explanation.sh
  - proposal-rationale.sh

# Merged into ~/.claude/settings.json; other keys and hook events are left as they are.
claude_code_settings:
  hooks:
    PreToolUse:
      - matcher: Bash
        hooks:
          - type: command
            command: ~/.claude/hooks/require-explanation.sh
    UserPromptSubmit:
      - hooks:
          - type: command
            command: ~/.claude/hooks/proposal-rationale.sh
