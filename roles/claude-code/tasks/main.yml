- name: Install Claude Code
  ansible.builtin.shell: set -o pipefail && curl -fsSL https://claude.ai/install.sh | bash
  args:
    executable: /bin/bash
    creates: ~/.local/bin/claude

- name: Ensure Claude Code hooks directory exists
  ansible.builtin.file:
    path: ~/.claude/hooks
    state: directory
    mode: "0755"

- name: Install Claude Code hook scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: ~/.claude/hooks/{{ item }}
    mode: "0755"
  loop: "{{ claude_code_hooks }}"

- name: Install global Claude Code instructions
  ansible.builtin.copy:
    src: CLAUDE.md
    dest: ~/.claude/CLAUDE.md
    mode: "0644"

- name: Ensure Claude Code settings file exists
  ansible.builtin.copy:
    content: "{}\n"
    dest: ~/.claude/settings.json
    mode: "0644"
    force: false

- name: Read current Claude Code settings
  ansible.builtin.slurp:
    src: ~/.claude/settings.json
  register: claude_code_settings_raw

- name: Merge managed hooks into Claude Code settings
  ansible.builtin.copy:
    content: "{{ (claude_code_settings_raw.content | b64decode | from_json) | combine(claude_code_settings, recursive=true) | to_nice_json }}\n"
    dest: ~/.claude/settings.json
    mode: "0644"
