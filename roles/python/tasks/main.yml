- name: Add pip3 as pip to .zshrc
  ansible.builtin.blockinfile:
    create: true
    path: ~/.zshrc
    marker: "# {mark} ANSIBLE MANAGED BLOCK FOR PYTHON"
    mode: "0644"
    block: |
      alias pip=pip3
      alias python=python3

- name: Install python
  community.general.homebrew:
    name: python

- name: Install pyenv
  community.general.homebrew:
    name: pyenv

- name: Configure pyenv init in .zshrc
  ansible.builtin.blockinfile:
    create: true
    path: ~/.zshrc
    marker: "# {mark} ANSIBLE MANAGED BLOCK FOR PYENV"
    mode: "0644"
    block: |
      export PYENV_ROOT="$HOME/.pyenv"
      [[ -d $PYENV_ROOT/bin ]] && export PATH="$PYENV_ROOT/bin:$PATH"
      # --no-rehash avoids the "find: .pyenv-shim: No such file" errors at startup;
      # run `pyenv rehash` manually after installing a new Python/tool.
      eval "$(pyenv init - --no-rehash zsh)"

- name: Install python-packaging
  community.general.homebrew:
    name: python-packaging

- name: Install pipx
  community.general.homebrew:
    name: pipx
  register: pipx_install

- name: Install uv (Python package and tool manager)
  community.general.homebrew:
    name: uv

- name: Install pip-outdated via pipx
  ansible.builtin.command:
    cmd: pipx install pip-outdated
  when: pipx_install is succeeded

- name: Ensure Vim bundle directory exists
  ansible.builtin.file:
    path: "~/.vim/bundle"
    state: directory
    mode: "0755"

- name: Install vim plugin (retry on transient network errors)
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "~/.vim/bundle/{{ item.dest }}"
    force: true
    version: HEAD
  loop:
    - { repo: "https://github.com/Vimjas/vim-python-pep8-indent.git", dest: "vim-python-pep8-indent" }
  register: git_clone
  retries: 5
  delay: 10
  until: git_clone is succeeded
