- name: Install jenv java environment manager
  community.general.homebrew:
    name: jenv

- name: Update .zshrc
  ansible.builtin.blockinfile:
    create: true
    path: ~/.zshrc
    marker: "# {mark} ANSIBLE MANAGED BLOCK FOR JENV"
    mode: "0644"
    block: |
      export PATH="$HOME/.jenv/bin:$PATH"
      eval "$(jenv init -)"

- name: Ensure jenv directories exist
  ansible.builtin.file:
    path: ~/.jenv/{{ item }}
    state: directory
    mode: "0755"
  loop:
    - plugins
    - versions

# `enable-plugin` is a shell function from `jenv init`; this is the command behind it.
- name: Enable jenv export plugin
  ansible.builtin.command:
    cmd: jenv sh-enable-plugin export
  args:
    creates: ~/.jenv/plugins/export

- name: Install current temurin
  community.general.homebrew_cask:
    name: temurin

- name: Remove Azul Zulu JDK 17
  community.general.homebrew_cask:
    name: zulu@17
    state: absent

# jenv versions are symlinks into /Library/Java; drop the ones whose JDK was uninstalled.
- name: Prune jenv versions whose JDK is gone
  ansible.builtin.command:
    cmd: find {{ ansible_facts['env']['HOME'] }}/.jenv/versions -type l ! -exec test -e {} ; -print -delete
  register: java_jenv_pruned
  changed_when: java_jenv_pruned.stdout != ""

- name: Install VisualVM
  community.general.homebrew_cask:
    name: visualvm
