- name: Install jenv java environment manager
  community.general.homebrew:
    name: jenv

- name: Update .zshrc
  ansible.builtin.blockinfile:
    create: true
    path: ~/.zshrc
    marker: "# {mark} ANSIBLE MANAGED BLOCK FOR JENV"
    mode: "0644"
    block: |
      export PATH="$HOME/.jenv/bin:$PATH"
      eval "$(jenv init -)"

- name: Ensure jenv plugins directory exists
  ansible.builtin.file:
    path: ~/.jenv/plugins
    state: directory
    mode: "0755"

# `enable-plugin` is a shell function from `jenv init`; this is the command behind it.
- name: Enable jenv export plugin
  ansible.builtin.command:
    cmd: jenv sh-enable-plugin export
  args:
    creates: ~/.jenv/plugins/export

- name: Install current temurin
  community.general.homebrew_cask:
    name: temurin

- name: Install VisualVM
  community.general.homebrew_cask:
    name: visualvm
