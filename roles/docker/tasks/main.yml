- name: Install docker
  community.general.homebrew:
    name: docker

- name: Install additional docker packages
  community.general.homebrew:
    name: docker-compose,colima

- name: Install docker buildx plugin
  community.general.homebrew:
    name: docker-buildx

- name: Ensure docker cli-plugins directory exists
  ansible.builtin.file:
    path: ~/.docker/cli-plugins
    state: directory
    mode: "0755"

- name: Determine docker-buildx installation prefix
  ansible.builtin.command: brew --prefix docker-buildx
  register: docker_buildx_prefix
  changed_when: false
  check_mode: false

- name: Link docker-buildx into cli-plugins
  ansible.builtin.file:
    path: ~/.docker/cli-plugins/docker-buildx
    state: link
    src: "{{ docker_buildx_prefix.stdout }}/bin/docker-buildx"

# Homebrew's docker formula ships the bare CLI; `docker compose` only exists once
# the docker-compose binary is linked into cli-plugins, exactly like buildx above.
# Without it docker reports "unknown shorthand flag: 'f' in -f" on `docker compose -f`.
- name: Determine docker-compose installation prefix
  ansible.builtin.command: brew --prefix docker-compose
  register: docker_compose_prefix
  changed_when: false
  check_mode: false

- name: Link docker-compose into cli-plugins
  ansible.builtin.file:
    path: ~/.docker/cli-plugins/docker-compose
    state: link
    src: "{{ docker_compose_prefix.stdout }}/bin/docker-compose"

# Provides docker-credential-osxkeychain so registry logins are stored in the
# macOS Keychain instead of base64 in ~/.docker/config.json.
# Enable with "credsStore": "osxkeychain" in ~/.docker/config.json, then re-login.
- name: Install docker-credential-helper for Keychain-backed registry logins
  community.general.homebrew:
    name: docker-credential-helper

- name: Install lima-additional-guestagents
  community.general.homebrew:
    name: lima-additional-guestagents

- name: Add colima socket as DOCKER_HOST
  ansible.builtin.blockinfile:
    create: true
    path: ~/.zprofile
    marker: "# {mark} ANSIBLE MANAGED BLOCK FOR DOCKER_HOST"
    mode: "0644"
    block: |
      export DOCKER_HOST="unix://$HOME/.colima/docker.sock"

- name: Remove hand-written docker shell aliases
  ansible.builtin.lineinfile:
    path: ~/.zshrc
    regexp: "{{ item }}"
    state: absent
  loop:
    - '^alias dk="docker"$'
    - '^alias dl="docker logs"$'

- name: Add docker shell aliases
  ansible.builtin.blockinfile:
    create: true
    path: ~/.zshrc
    marker: "# {mark} ANSIBLE MANAGED BLOCK FOR DOCKER ALIASES"
    mode: "0644"
    block: |
      alias dk="docker"
      alias dl="docker logs"
