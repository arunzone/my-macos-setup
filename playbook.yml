---
- name: Play for setting up my-macos-setup
  hosts: all

  vars_prompt:
    - name: become_password
      prompt: "sudo (BECOME) password"
      private: true

  vars:
    ansible_become_password: "{{ become_password }}"
    node_version: v22.14.0

    # Apps that may arrive outside Homebrew (MDM, self-updaters); Homebrew refuses
    # to install a cask over them, so those cask tasks are skipped when found.
    external_apps:
      - { cask: 1password, app: /Applications/1Password.app }
      - { cask: devin-desktop, app: /Applications/Devin.app }
      - { cask: dropbox, app: /Applications/Dropbox.app }
      - { cask: google-chrome, app: /Applications/Google Chrome.app }
      - { cask: handbrake, app: /Applications/HandBrake.app }
      - { cask: iterm2, app: /Applications/iTerm.app }
      - { cask: slack, app: /Applications/Slack.app }
      - { cask: zoom, app: /Applications/zoom.us.app }

  # pkg-based casks run `sudo installer`; the module hands this over via SUDO_ASKPASS.
  module_defaults:
    community.general.homebrew_cask:
      sudo_password: "{{ become_password }}"

  # nvm is only sourced in interactive zsh, so expose its node/npm to every task.
  environment:
    PATH: "{{ lookup('env', 'HOME') }}/.nvm/versions/node/{{ node_version }}/bin:{{ lookup('env', 'PATH') }}"

  pre_tasks:
    - name: Get brew path
      ansible.builtin.command: brew --prefix
      register: brew_path
      changed_when: false

    - name: List casks already managed by Homebrew
      tags: always
      ansible.builtin.command: brew list --cask
      register: brew_casks
      changed_when: false

    - name: Check for apps installed outside Homebrew
      tags: always
      ansible.builtin.stat:
        path: "{{ item.app }}"
      loop: "{{ external_apps }}"
      loop_control:
        label: "{{ item.cask }}"
      register: external_apps_stat

    - name: Set casks to skip
      tags: always
      ansible.builtin.set_fact:
        skipped_casks: >-
          {{ external_apps_stat.results
             | selectattr('stat.exists')
             | map(attribute='item.cask')
             | reject('in', brew_casks.stdout_lines)
             | list }}

    - name: Add brew to shell
      ansible.builtin.blockinfile:
        create: true
        path: ~/.zprofile
        marker: "# {mark} ANSIBLE MANAGED BLOCK FOR BREW"
        mode: "0644"
        block: |
          eval "$({{ brew_path.stdout_lines[0] }}/bin/brew shellenv)"

    # pipx, uv, claude and it2 all install into ~/.local/bin.
    - name: Add ~/.local/bin to shell PATH
      ansible.builtin.blockinfile:
        create: true
        path: ~/.zprofile
        marker: "# {mark} ANSIBLE MANAGED BLOCK FOR LOCAL BIN"
        mode: "0644"
        block: |
          export PATH="$HOME/.local/bin:$PATH"

    - name: Add /usr/local/sbin to path
      ansible.builtin.lineinfile:
        path: /etc/paths
        line: '/usr/local/sbin'
        insertbefore: '/usr/sbin'
      become: true

    - name: Update hostname
      ansible.builtin.hostname:
        name: "{{ ansible_facts['user_id'] }}-mac"
      become: true

  roles:

    - { role: android, tags: ["android"] }
    - { role: source-control, tags: ["source-control"] }
    - { role: docker, tags: ["docker"] }
    - { role: python, tags: ["python"] }
    - { role: cli-tools, tags: ["cli-tools"] }
    - { role: vim, tags: ["vim"] }
    - { role: system, tags: ["system"] }
    - { role: java, tags: ["java"] }
    - { role: ide, tags: ["ide"] }
    - { role: gradle, tags: ["gradle"] }
    - { role: maven, tags: ["maven"] }
    - { role: node, tags: ["node"] }
    - { role: golang, tags: ["golang"] }
    - { role: kotlin, tags: ["kotlin"] }
    - { role: ruby, tags: ["ruby"] }
    - { role: xcode, tags: ["xcode", "appstore"] }
    - { role: office, tags: ["office"] }
    - { role: calendar, tags: ["calendar"] }
    - { role: voice-command, tags: ["voice-command"] }
    - { role: obsidian, tags: ["obsidian"] }
    - { role: plantuml, tags: ["plantuml"] }
    - { role: semgrep, tags: ["semgrep"] }
    - { role: security, tags: ["security"] }
    - { role: internet, tags: ["internet"] }
    - { role: infrastructure-as-code, tags: ["infrastructure-as-code"] }
    - { role: aws, tags: ["aws"] }
    - { role: media, tags: ["media"] }
    - { role: photography, tags: ["photography"] }
    - { role: claude-code, tags: ["claude-code"] }
    - { role: herdr, tags: ["herdr"] }
    - { role: llm, tags: ["llm"] }
    - { role: alto, tags: ["alto"] }
    - { role: github-runner, tags: ["github-runner", "never"] }

  post_tasks:

    - name: Change .local ownership and permissions
      ansible.builtin.file:
        path: "{{ brew_path.stdout_lines[0] }}/share"
        owner: "{{ ansible_facts['user_id'] }}"
        recurse: true
        mode: '0755'
      become: true
