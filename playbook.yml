---
- name: Play for setting up my-macos-setup
  hosts: all

  vars_prompt:
    - name: become_password
      prompt: "sudo (BECOME) password"
      private: true

  vars:
    # Drive Ansible's own become and the Homebrew pkg-cask askpass helper from a
    # single prompted value (replaces the -K prompt); see infrastructure-as-code role.
    ansible_become_password: "{{ become_password }}"

  pre_tasks:
    - name: Get brew path
      ansible.builtin.command: brew --prefix
      register: brew_path
      changed_when: false

    - name: Add brew to shell
      ansible.builtin.blockinfile:
        create: true
        path: ~/.zprofile
        marker: "# {mark} ANSIBLE MANAGED BLOCK FOR BREW"
        mode: "0644"
        block: |
          eval "$({{ brew_path.stdout_lines[0] }}/bin/brew shellenv)"

    - name: Add /usr/local/sbin to path
      ansible.builtin.lineinfile:
        path: /etc/paths
        line: '/usr/local/sbin'
        insertbefore: '/usr/sbin'
      become: true

    - name: Update hostname
      ansible.builtin.hostname:
        name: "{{ ansible_facts['user_id'] }}-mac"
      become: true

    # Created in pre_tasks so every role (cli-tools, infrastructure-as-code, ...)
    # can install pkg-based casks that shell out to `sudo installer`.
    # tags: always so tag-scoped runs (e.g. --tags cli-tools) still create it.
    - name: Create sudo askpass helper for unattended pkg cask installs
      tags: always
      ansible.builtin.copy:
        dest: ~/.ansible/sudo_askpass.sh
        mode: "0700"
        content: |
          #!/bin/sh
          # Emits the sudo password so Homebrew's nested, non-interactive
          # `sudo installer` for pkg-based casks can authenticate without a TTY.
          # Reads a transient 0600 file (not an env var) because Homebrew scrubs
          # its environment before shelling out, which would strip a passed value.
          # This script itself holds no secret.
          cat "{{ ansible_facts['env']['HOME'] }}/.ansible/.sudo_pass"

  roles:

    - { role: android, tags: ["android"] }
    - source-control
    - { role: docker, tags: ["docker"] }
    - python
    - { role: cli-tools, tags: ["cli-tools"] }
    - vim
    - { role: system, tags: ["system"] }
    - { role: java, tags: ["java"] }
    - { role: ide, tags: ["ide"] }
    - gradle
    - maven
    - node
    - golang
    - kotlin
    - ruby
    - xcode
    - { role: office, tags: ["office"] }
    - calendar
    - voice-command
    - obsidian
    - plantuml
    - semgrep
    - security
    - internet
    - { role: infrastructure-as-code, tags: ["infrastructure-as-code"] }
    - { role: aws, tags: ["aws"] }
    - media
    - photography
    - { role: claude-code, tags: ["claude-code"] }
    - { role: llm, tags: ["llm"] }

  post_tasks:

    - name: Change .local ownership and permissions
      ansible.builtin.file:
        path: "{{ brew_path.stdout_lines[0] }}/share"
        owner: "{{ ansible_facts['user_id'] }}"
        recurse: true
        mode: '0755'
      become: true
